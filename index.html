<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IconLab – Discover. Customize. Download.</title>
    <meta name="description" content="Search millions of open-source icons, customize color, size, rotation and background, then download SVG, PNG or JPEG right in your browser." />
    <meta name="theme-color" content="#0f1020" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="IconLab" />
    <meta property="og:title" content="IconLab – Discover. Customize. Download." />
    <meta property="og:description" content="Search, customize and download icons for your next project." />
    <meta property="og:image" content="/og-image.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="IconLab – Discover. Customize. Download." />
    <meta name="twitter:description" content="Search, customize and download icons for your next project." />
    <link rel="preconnect" href="https://api.iconify.design" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var t = JSON.parse(localStorage.getItem('iconlab:theme') || 'null');
          var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>IconLab requires JavaScript to search and customize icons.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
